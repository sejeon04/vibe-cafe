<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- CSS 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- [페이지 상단] 카페 헤더 영역 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- [주문서 항목] 주문 폼 (JS 유효성 검사를 위해 novalidate 속성 부여) -->
  <main>
    <form id="order-form" novalidate>
      <!-- 1. 이름 -->
      <div class="form-group">
        <label for="customer-name">이름</label>
        <input type="text" id="customer-name" name="customer-name" required>
      </div>

      <!-- 2. 전화번호 -->
      <div class="form-group">
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customer-phone">
      </div>

      <!-- 3. 음료 선택 -->
      <div class="form-group">
        <label for="drink-select">음료 선택</label>
        <select id="drink-select" name="drink-select">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="latte" data-price="4000">카페라떼 4,000원</option>
          <option value="mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
          <option value="caramel-macchiato" data-price="5000">카라멜마끼아또 5,000원</option>
          <option value="chocolate" data-price="4000">핫초코 4,000원</option>
          <option value="earl-grey" data-price="4000">얼그레이 4,000원</option>
          <option value="peppermint" data-price="4000">페퍼민트 4,000원</option>
          <option value="chamomile" data-price="4000">캐모마일 4,000원</option>
        </select>
      </div>

      <!-- 4. 온도 선택 (HOT / ICE) -->
      <fieldset class="form-group">
        <legend>온도</legend>
        <div>
          <input type="radio" id="temp-hot" name="temperature" value="HOT" checked>
          <label for="temp-hot">HOT (따뜻하게)</label>
        </div>
        <div>
          <input type="radio" id="temp-ice" name="temperature" value="ICE">
          <label for="temp-ice">ICE (시원하게)</label>
        </div>
      </fieldset>

      <!-- 5. 사이즈 선택 -->
      <fieldset class="form-group">
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S (+0원)</label>
        </div>
        <div>
          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M (+500원)</label>
        </div>
        <div>
          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L (+1,000원)</label>
        </div>
      </fieldset>

      <!-- 6. 추가 옵션 -->
      <fieldset class="form-group">
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="option-shot" name="option" value="shot" data-price="500">
          <label for="option-shot">샷 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-cream" name="option" value="cream" data-price="500">
          <label for="option-cream">크림 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-syrup" name="option" value="syrup" data-price="300">
          <label for="option-syrup">시럽 추가 (+300원)</label>
        </div>
        <div>
          <input type="checkbox" id="option-decaf" name="option" value="decaf" data-price="0">
          <label for="option-decaf">디카페인 (+0원)</label>
        </div>
      </fieldset>

      <!-- 7. 수량 -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 8. 요청사항 -->
      <div class="form-group">
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4"></textarea>
      </div>

      <!-- 9. 예상 금액 표시 영역 -->
      <div id="total-price-area" class="price-area">
        예상 금액: <span id="total-price">0</span>원
      </div>

      <!-- 10 & 11. 주문하기 버튼 및 다시 작성 버튼 -->
      <div class="button-group">
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 12. 주문 확인 메시지 영역 (처음에는 숨김) -->
    <div id="order-confirm-message" class="confirm-message" style="display: none;"></div>
  </main>

  <!-- Supabase JS v2 CDN 연결 (script.js보다 먼저 로드되어야 합니다) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- JavaScript 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
